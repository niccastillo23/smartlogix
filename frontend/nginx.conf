server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de la SPA: cualquier ruta desconocida vuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El cliente llama a /api; se reenvía al gateway BFF (nombre de servicio en la red de compose).
    location /api/ {
        proxy_pass http://bff-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Política de contenido: solo recursos del mismo origen (INC-21, alerta DAST de riesgo medio).
    # 'unsafe-inline' en estilos: los componentes usan estilos en línea (Tailwind/Framer Motion).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
}
