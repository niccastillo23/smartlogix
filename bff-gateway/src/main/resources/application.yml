server:
  port: 8080

spring:
  application:
    name: bff-gateway

services:
  inventory:
    url: ${SERVICES_INVENTORY_URL:http://localhost:8081}
  order:
    url: ${SERVICES_ORDER_URL:http://localhost:8082}
  shipping:
    url: ${SERVICES_SHIPPING_URL:http://localhost:8083}

jwt:
  # Obligatorio: definir la variable de entorno JWT_SECRET (mínimo 64 bytes para HS512). Sin valor por defecto.
  secret: ${JWT_SECRET}
  expiration: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
